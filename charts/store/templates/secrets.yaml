{{- /* Nothing here comes from values or git. "keep": an uninstall leaves them, since the volumes outlive it too. */}}
{{- range $secret := list
      (dict "name" "mariadb" "keys" (list (list "root-password" "" 24) (list "password" "" 24)))
      (dict "name" "wordpress" "keys" (list (list "admin-password" "" 20)))
      (dict "name" "woo-rest" "keys" (list (list "consumer-key" "ck_" 40) (list "consumer-secret" "cs_" 40)))
      (dict "name" "woo-mcp" "keys" (list (list "bearer-token" "" 48))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  labels: {{- include "store.labels" (list $ $secret.name) | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  {{- range $k := $secret.keys }}
  {{ index $k 0 }}: {{ include "store.secretValue" (list $ $secret.name (index $k 0) (index $k 1) (index $k 2)) }}
  {{- end }}
{{- end }}
