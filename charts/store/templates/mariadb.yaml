apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: {{- include "store.labels" (list $ "mariadb") | nindent 4 }}
spec:
  clusterIP: None   # headless: the StatefulSet's own stable name
  selector: {{- include "store.match" (list $ "mariadb") | nindent 4 }}
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: {{- include "store.labels" (list $ "mariadb") | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "store.match" (list $ "mariadb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" (list $ "mariadb") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # The official image runs as its mysql user (999) when started as that user.
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999 }
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: {{ .Values.mariadb.database | quote }} }
            - { name: MARIADB_USER, value: {{ .Values.mariadb.user | quote }} }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb, key: password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb, key: root-password } }
          # healthcheck.sh ships with the image and logs in with its own probe user.
          # Ready means InnoDB has finished starting; alive only means it accepts connections.
          readinessProbe:
            exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec: { command: [healthcheck.sh, --connect] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.mariadb.storage }} } }
