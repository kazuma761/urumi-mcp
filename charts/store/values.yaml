# Shared by every environment. values-local.yaml and values-prod.yaml override only
# what really differs.
global:
  domain: 127.0.0.1.nip.io
  storageClass: local-path
  tls:
    enabled: false
    clusterIssuer: ""   # cert-manager ClusterIssuer, read only when tls.enabled
ingressClassName: traefik

store:
  host: store            # public host: <host>.<global.domain>
  title: Urumi Demo Store
  adminUser: admin
  adminEmail: admin@urumi.local
  country: "IN:KA"       # WooCommerce format <country>:<state>
  currency: INR
  timezone: Asia/Kolkata # what "today" means, for the store and for woo-mcp
  products:              # so a shopper has something to buy on day one
    - { sku: URUMI-TEE, name: Urumi T-shirt, price: "799" }
    - { sku: URUMI-MUG, name: Urumi Mug, price: "349" }

mariadb:
  image: { repository: mariadb, tag: "11.8", pullPolicy: IfNotPresent }
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

wordpress:
  # WooCommerce 11.2 needs WordPress 7.0 or newer to activate.
  image: { repository: wordpress, tag: 7.1.3-apache, pullPolicy: IfNotPresent }
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

bootstrap:
  image: { repository: wordpress, tag: cli-2.12.0, pullPolicy: IfNotPresent }
  woocommerceVersion: 11.2.1
  waitTimeoutSeconds: 600
  backoffLimit: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

wooMcp:
  image: { repository: urumi/woo-mcp, tag: dev, pullPolicy: IfNotPresent }
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }

networkPolicy:
  # Who may open the storefront: the ingress controller's pods.
  ingressController:
    namespace: kube-system
    podLabels: { app.kubernetes.io/name: traefik }
  # Who may call woo-mcp: the gateway's pods, and no one else.
  gateway:
    namespace: platform
    podLabels: { app.kubernetes.io/name: gateway }
