apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app.kubernetes.io/name: postgres } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, labels: { app.kubernetes.io/name: postgres } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      automountServiceAccountToken: false
      # 70 is the postgres user in the Alpine image.
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70 }
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: gateway }
            - { name: POSTGRES_DB, value: gateway }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            # A subdirectory: the volume root may hold lost+found, which initdb refuses.
            - { name: PGDATA, value: /var/lib/postgresql/data/db }
          readinessProbe: { exec: { command: [pg_isready, -U, gateway] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, gateway] }, periodSeconds: 20, initialDelaySeconds: 30 }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes: [{ name: run, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
