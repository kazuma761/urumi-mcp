{{- /* Generated in the cluster on first install, reused on every upgrade, kept on uninstall. */}}
{{- $pg := (lookup "v1" "Secret" .Release.Namespace "postgres").data | default dict }}
{{- $gw := (lookup "v1" "Secret" .Release.Namespace "gateway").data | default dict }}
{{- $seeds := list }}
{{- range .Values.seedServers }}
{{- $seed := omit . "credentialFrom" }}
{{- with .credentialFrom }}
{{- $src := (lookup "v1" "Secret" .namespace .secret).data | default dict }}
{{- /* Empty under `helm template`, which has no cluster; the gateway then reports the server as rejecting its credential. */}}
{{- $_ := set $seed "credential" (get $src .key | b64dec) }}
{{- end }}
{{- $seeds = append $seeds $seed }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  password: {{ get $pg "password" | default (randAlphaNum 32 | b64enc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
data:
  admin-password: {{ get $gw "admin-password" | default (randAlphaNum 20 | b64enc) }}
  session-secret: {{ get $gw "session-secret" | default (randAlphaNum 48 | b64enc) }}
  # 32 random bytes for AES-256. Regenerating it would orphan every stored upstream credential.
  encryption-key: {{ get $gw "encryption-key" | default (randBytes 32 | b64enc) }}
  # From values when given; otherwise whatever an earlier install stored.
  llm-api-key: {{ .Values.llm.apiKey | b64enc | default (get $gw "llm-api-key") | default "" | quote }}
  seed-servers: {{ toJson $seeds | b64enc }}
