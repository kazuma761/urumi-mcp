<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="Urumi MCP Gateway">
  <title>Urumi MCP Gateway</title>
  <g fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round">
    <!-- clients on the left, servers on the right, every line meets at one gateway -->
    <path d="M18 30 C 50 30, 50 70, 70 70"/>
    <path d="M18 70 L 70 70"/>
    <path d="M18 110 C 50 110, 50 70, 70 70"/>
    <path d="M110 70 C 130 70, 130 30, 162 30"/>
    <path d="M110 70 L 162 70"/>
    <path d="M110 70 C 130 70, 130 110, 162 110"/>
  </g>
  <g fill="#141413">
    <circle cx="14" cy="30" r="7"/><circle cx="14" cy="70" r="7"/><circle cx="14" cy="110" r="7"/>
    <rect x="160" y="22" width="16" height="16" rx="3"/><rect x="160" y="62" width="16" height="16" rx="3"/><rect x="160" y="102" width="16" height="16" rx="3"/>
  </g>
  <rect x="64" y="52" width="52" height="36" rx="18" fill="#CC785C"/>
  <circle cx="90" cy="70" r="6" fill="#FAF9F5"/>
  <text x="206" y="80" font-family="Georgia, 'EB Garamond', 'Times New Roman', serif" font-size="62" fill="#141413" letter-spacing="-1">urumi</text>
  <text x="210" y="112" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#5f5d57" letter-spacing="3.5">MCP GATEWAY</text>
  <text x="372" y="80" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="26" fill="#CC785C">✱</text>
</svg>
